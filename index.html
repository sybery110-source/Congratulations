            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-5px, 5px); }
            50% { transform: translate(5px, -5px); }
            75% { transform: translate(-5px, -5px); }

            width: 100%;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .monitor.exploding {
            animation: monitorShake 0.05s infinite;
            box-shadow: 
                0 0 0 4px #ff0000,
                0 0 0 8px #ff3300,
                inset 0 0 50px rgba(255, 0, 0, 0.5);
            border-color: #ff0000;
        }

        @keyframes monitorShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(1deg) scale(1.01); }
            75% { transform: rotate(-1deg) scale(0.99); }
        }

        .screen {
            background-color: #0b1a0b;
            padding: 40px 30px;
            border-radius: 12px;

            overflow: hidden;

            50% { opacity: 0.7; }

            top: 0;

            height: 100%;

    function typeText(text, callback, speed = 25) {
        const cursor = outputEl.querySelector('.cursor');
        if (cursor) cursor.remove();

        outputEl.innerHTML = '';
        let index = 0;
        const interval = setInterval(() => {
            if (index < text.length) {
                let char = text.charAt(index);
                if (char === ' ') char = '&nbsp;';
                else if (char === '\n') char = '<br>';
                outputEl.innerHTML += char;
                index++;
                outputEl.scrollTop = outputEl.scrollHeight;
            } else {
                clearInterval(interval);
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'cursor';
                outputEl.appendChild(cursorSpan);
                if (callback) callback();
            }
        }, speed);
    }

    function clearAndType(text, callback, speed = 25) {
        const cursor = outputEl.querySelector('.cursor');
        if (cursor) cursor.remove();
        outputEl.innerHTML = '';
        typeText(text, callback, speed);
    }

║    "Знание — сила, а информатика —
║     суперсила!" 🦸
╚══════════════════════════════════════════════

> Нажмите Enter для возврата в меню...
        `;
        clearAndType(info, () => {
            inputField.placeholder = 'нажмите Enter...';
            inputField.value = '';
            const enterHandler = function(e) {
                if (e.key === 'Enter') {
                    inputField.removeEventListener('keydown', enterHandler);
                    showMenu();
                }
            };
            inputField.addEventListener('keydown', enterHandler);
        }, 20);
    }

    // === 0. ВЫХОД ===
    function rebootSystem() {
        const rebootMsg = `
╔══════════════════════════════════════════════
║    🔄 ПЕРЕЗАГРУЗКА СИСТЕМЫ...
║
║    До свидания, Иван Васильевич!
║    Спасибо, что были с нами!
║
║    ... перезагрузка через 3 секунды ...
╚══════════════════════════════════════════════
        `;
        clearAndType(rebootMsg, () => {
            setTimeout(() => {
                location.reload();
            }, 3000);
        }, 20);
    }

    // === ОБРАБОТКА КОМАНД ===
    function handleMenuCommand(input) {
        const cmd = input.trim();

        switch(cmd) {
            case '1':
                showSchedule();
                break;
            case '2':
                showLuckCode();
                break;
            case '3':
                showSystemInfo();
                break;
            case '4':
                if (confirm('⚠️ ВНИМАНИЕ! Это приведет к уничтожению системы! Продолжить?')) {
                    explodeSystem();
                } else {
                    outputEl.innerHTML += `<br>> Команда отменена.`;
                    const cursorSpan = document.createElement('span');
                    cursorSpan.className = 'cursor';
                    outputEl.appendChild(cursorSpan);
                    inputField.value = '';
                    inputField.focus();
                }
                break;
            case '0':
                rebootSystem();
                break;
            default:
                outputEl.innerHTML += `<br><span class="error-text">⚠ Неизвестная команда: "${cmd}"</span>`;
                outputEl.innerHTML += `<br>> Попробуйте снова (0-4):`;
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'cursor';
                outputEl.appendChild(cursorSpan);
                inputField.value = '';
                inputField.focus();
        }
    }

    // === ГЛАВНАЯ ОБРАБОТКА ===
    function handleSubmit() {
        const input = inputField.value.trim();

        if (!input) {
            inputField.value = '';
            inputField.placeholder = 'введите что-нибудь...';
            return;
        }

        const cursor = outputEl.querySelector('.cursor');
        if (cursor) cursor.remove();

        if (!isAuthenticated) {
            outputEl.innerHTML += `<br>➤ ${input}`;

            if (checkName(input)) {
                isAuthenticated = true;
                inputLine.style.display = 'none';
                const welcome = `
╔══════════════════════════════════════════════
║    ДОСТУП РАЗРЕШЕН! 🟢
║
║    С 1 Сентября, Иван Васильевич!
║
║    Поздравляет вас ваш ученик —
║    Шустов Иван.
║
║    Желаю вам в новом учебном году:
║    • Крепкого здоровья
║    • Терпения и мудрости
║    • Любознательных учеников
║    • Интересных проектов
║
║    Спасибо за ваши уроки!
║
║    Нажмите Enter для продолжения...
╚══════════════════════════════════════════════
                `;
                clearAndType(welcome, () => {
                    inputLine.style.display = 'flex';
                    inputField.value = '';
                    inputField.placeholder = 'нажмите Enter...';
                    const enterHandler = function(e) {
                        if (e.key === 'Enter') {
                            inputField.removeEventListener('keydown', enterHandler);
                            showMenu();
                        }
                    };
                    inputField.addEventListener('keydown', enterHandler);
                }, 20);
            } else {
                const errorMsg = `
╔══════════════════════════════════════════════
║    ❌ ОШИБКА АВТОРИЗАЦИИ!
║
║    Доступ запрещен.
║    Это поздравление для
║    Ивана Фадеенко (Ивана Васильевича)!
║
║    Попробуйте еще раз.
╚══════════════════════════════════════════════

> Введите имя:
                `;
                clearAndType(errorMsg, () => {
                    inputField.value = '';
                    inputField.focus();
                }, 20);
            }
        } else {
            handleMenuCommand(input);
        }
    }

    // === СОБЫТИЯ ===
    sendBtn.addEventListener('click', handleSubmit);
    inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSubmit();
        }
    });

    // === СТАРТ ===
    window.onload = function() {
        const startMessage = `
╔══════════════════════════════════════════════
║    ДОБРО ПОЖАЛОВАТЬ В СИСТЕМУ!
║
║    🔐 ТРЕБУЕТСЯ АВТОРИЗАЦИЯ
║
║    Это поздравление от ученика
║    Шустова Ивана.
║
║    Пожалуйста, представьтесь:
╚══════════════════════════════════════════════

> Введите ваше имя:
        `;
        typeText(startMessage, () => {
            inputField.focus();
            inputField.placeholder = 'введите имя...';
        }, 20);
    };
</script>
