<!DOCTYPE html>
<html lang="ru">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0f0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, 'Lucida Sans Typewriter', monospace;
            padding: 10px;
            transition: background-color 0.5s;
        }

        body.exploding {
            background-color: #1a0000 !important;
            animation: shake 0.1s infinite;
        }

        body.shaking {
            animation: shake 0.05s infinite !important;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-10px, 10px); }
            50% { transform: translate(10px, -10px); }
            75% { transform: translate(-10px, -10px); }
        }

        .monitor {
            background-color: #1a2a1a;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 
                0 0 0 3px #2a3a2a,
                0 0 0 6px #0f140f,
                inset 0 0 20px rgba(0, 0, 0, 0.8);
            max-width: 950px;
            width: 100%;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .monitor.exploding {
            animation: monitorShake 0.05s infinite;
            box-shadow: 
                0 0 0 3px #ff0000,
                0 0 0 6px #ff3300,
                inset 0 0 50px rgba(255, 0, 0, 0.5);
            border-color: #ff0000;
        }

        @keyframes monitorShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(1deg) scale(1.01); }
            75% { transform: rotate(-1deg) scale(0.99); }
        }

        .screen {
            background-color: #0b1a0b;
            padding: 20px 15px;
            border-radius: 10px;
            box-shadow:

            position: relative;
            overflow: hidden;
            transition: all 0.3s;

        .screen.exploding {
            background-color: #0a0000 !important;
            border-color: #ff0000 !important;
            box-shadow: 
                inset 0 0 80px rgba(255, 0, 0, 0.3),
                0 0 60px rgba(255, 0, 0, 0.2) !important;
            animation: screenFlicker 0.05s infinite;
        }

        @keyframes screenFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .screen::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.03) 0px,
                rgba(0, 0, 0, 0.03) 2px,

            z-index: 2;

            line-height: 1.7;

    function typeText(text, callback, speed = 25) {
        const cursor = outputEl.querySelector('.cursor');
        if (cursor) cursor.remove();

        outputEl.innerHTML = '';
        let index = 0;
        const interval = setInterval(() => {
            if (index < text.length) {
                let char = text.charAt(index);
                if (char === ' ') char = '&nbsp;';
                else if (char === '\n') char = '<br>';
                outputEl.innerHTML += char;
                index++;
                outputEl.scrollTop = outputEl.scrollHeight;
            } else {
                clearInterval(interval);
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'cursor';
                outputEl.appendChild(cursorSpan);
                if (callback) callback();
            }
        }, speed);
    }

    function clearAndType(text, callback, speed = 25) {
        const cursor = outputEl.querySelector('.cursor');
        if (cursor) cursor.remove();
        outputEl.innerHTML = '';
        typeText(text, callback, speed);
    }

    function showHtml(html, callback) {
        const cursor = outputEl.querySelector('.cursor');
        if (cursor) cursor.remove();
        outputEl.innerHTML = html;
        const cursorSpan = document.createElement('span');
        cursorSpan.className = 'cursor';
        outputEl.appendChild(cursorSpan);
        if (callback) callback();

        return allowedNames.some(allowed => cleanName.includes(allowed) || allowed.includes(cleanName));

        win.style.zIndex = 10000 + windowCounter;

    function closeWindow(winId) {
        const win = document.getElementById(winId);
        if (win) {
            win.style.transition = 'all 0.3s';
            win.style.transform = 'scale(0) rotate(20deg)';
            win.style.opacity = '0';
            setTimeout(() => {
                if (win.parentNode) {
                    win.parentNode.removeChild(win);
                }
            }, 300);
            windows = windows.filter(id => id !== winId);
        }
    }

    function makeDraggable(element) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        element.onmousedown = dragMouseDown;
        element.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function dragTouchStart(e) {
            const touch = e.touches[0];
            pos3 = touch.clientX;
            pos4 = touch.clientY;
            document.ontouchend = closeDragElementTouch;
            document.ontouchmove = elementDragTouch;
        }

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            element.style.top = (element.offsetTop - pos2) + 'px';
            element.style.left = (element.offsetLeft - pos1) + 'px';
        }

        function elementDragTouch(e) {
            const touch = e.touches[0];
            pos1 = pos3 - touch.clientX;
            pos2 = pos4 - touch.clientY;
            pos3 = touch.clientX;
            pos4 = touch.clientY;
            element.style.top = (element.offsetTop - pos2) + 'px';
            element.style.left = (element.offsetLeft - pos1) + 'px';
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }

        function closeDragElementTouch() {
            document.ontouchend = null;
            document.ontouchmove = null;
        }
    }
